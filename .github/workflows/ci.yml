name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.12 quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check src tests

      - name: Type-check
        run: mypy src

      - name: Test
        run: pytest

      - name: Validate model configurations
        run: python -m shadowcrafter.cli config validate configs/models/shadowcrafter-9b.yaml

      - name: Enforce local weight-custody policy
        run: scripts/check-local-weight-custody.sh
