version: 2
policy:
  unknown_source: prohibited
  missing_or_ambiguous_license: quarantine
  raw_malware: prohibited
  eval_to_train: prohibited
  split_before_instruction_generation: true
  require_content_sha256: true
  require_group_split: true
  temporal_holdout_requires_cutoff: true
  max_snapshot_bytes: 268435456

# `allow_train`, `rag_only`, `eval_only`, `quarantine`, and `prohibited` are
# mutually exclusive. Moving a source to a broader class requires a reviewed
# registry change; collection code may never widen the class dynamically.
sources:
  - id: odytssey-curated-security-instructions
    title: Odytssey reviewed defensive-security instructions
    provider: Odytssey
    type: git
    policy_class: allow_train
    allowed_purposes: [train, rag]
    url: https://github.com/Odytssey/ShadowCrafter.git
    license:
      id: Apache-2.0
      url: https://www.apache.org/licenses/LICENSE-2.0
      status: verified
      redistribution: notice_required
      attribution_required: true
    attribution: Odytssey ShadowCrafter curated data
    mutable: true
    temporal_snapshot: true
    safety:
      content_kind: defensive_guidance
      raw_malware_binaries: false
      executable_content: false
      required_filters: [human-review, secret-scan, pii-scan, dual-use-policy]
    split_group_keys: [provenance.record_key, split_group]
    time_fields: [labels.published_at, provenance.retrieved_at]

